defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
episodic: false
world_model_kind: tdmpc2
sd_hidden_dim: 256
sd_dt: 0.02
sd_hop_speed: 2.0
sd_residual_scale: 5.0
sd_passive_scale: 10.0
sd_struct_dim: 17
sd_latent_dim: 512
sd_struct_loss_scale_mode: batch_std
sd_struct_loss_scale_floor: 0.1
sd_latent_consistency_struct_weight: 1.0
sd_latent_consistency_resid_weight: 1.0
sd_reward_mode: learned
sd_env_reward_scale: 1.0
sd_reward_hybrid_alpha: 0.5
sd_reward_curriculum_start: 10000
sd_reward_curriculum_end: 30000
sd_reward_curriculum_alpha: 0.5
sd_reward_curriculum_alpha_min: 0.1
sd_dense_pose_delta_weight: 0.40
sd_dense_pose_abs_weight: 0.0
sd_dense_pose_milestone_scale: 0.25
sd_dense_pose_gamma: 0.995
sd_recover_penalty_scale: 0.10
sd_stage_mode: full
sd_action_prior_enabled: false
sd_use_transition_residual: false
sd_transition_residual_scale: 1.0
sd_max_resid_scale: 5.0
sd_struct_residual_scale: 0.10
sd_vx_residual_scale: 0.50
sd_vz_residual_scale: 3.00
sd_pitch_residual_scale: 0.75
sd_pitch_rate_residual_scale: 8.00
sd_knee_residual_scale: 0.35
sd_struct_residual_penalty_coef: 0.0
sd_detach_core_in_main_loss: true
sd_trend_protect_max_scale: 0.20
sd_trend_protect_min_correction: 0.0
sd_height_loss_coef: 0.05
sd_online_supervision_enabled: false
sd_online_supervision_lr: 3e-4
sd_online_supervision_one_step_weight: 1.0
sd_online_supervision_rollout_weight: 1.0
sd_online_supervision_omega_weight: 0.25
sd_online_supervision_contact_weight: 0.25
sd_online_supervision_phase_weight: 2.0
sd_online_planning_weight_enabled: false
sd_online_planning_weight_mode: td_positive
sd_online_planning_weight_coef: 1.0
sd_online_planning_weight_max: 5.0
hopper_stage_reset_pool_csv: null
init_from: null
sd_supervised_init_from: null
resume_from: null
save_full_state: true

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 50000
save_eval_traces: true

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
replay_capacity: null
updates_per_step: 1
seed_pretrain_updates: null
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: ???
wandb_entity: ???
wandb_silent: false
enable_wandb: true
save_csv: true
train_log_freq: 100
checkpoint_freq: null
checkpoint_at_seed: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
