hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 60
    cpus_per_task: null
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: null
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.LocalLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task=hopper-hop
    - world_model_kind=sd_hopper
    - sd_reward_mode=hybrid
    - sd_reward_hybrid_alpha=0.2
    - model_size=null
    - obs=state
    - steps=5000
    - seed=3
    - exp_name=sd_hopper_5k_archfix_r1
    - enable_wandb=false
    - save_video=false
    - save_agent=true
    - save_csv=true
    - eval_episodes=3
    - eval_freq=1000
    - compile=false
    - num_samples=128
    - num_elites=16
    - num_pi_trajs=16
    - horizon=3
    - iterations=3
    - batch_size=128
    - mlp_dim=256
    - latent_dim=32
    - num_q=3
    - dropout=0.01
    - lr=3e-4
  job:
    name: train
    chdir: null
    override_dirname: batch_size=128,compile=false,dropout=0.01,enable_wandb=false,eval_episodes=3,eval_freq=1000,exp_name=sd_hopper_5k_archfix_r1,horizon=3,iterations=3,latent_dim=32,lr=3e-4,mlp_dim=256,model_size=null,num_elites=16,num_pi_trajs=16,num_q=3,num_samples=128,obs=state,save_agent=true,save_csv=true,save_video=false,sd_reward_hybrid_alpha=0.2,sd_reward_mode=hybrid,seed=3,steps=5000,task=hopper-hop,world_model_kind=sd_hopper
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/data/round/code/sd_world_model_rl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/data/round/code/sd_world_model_rl/external/tdmpc2/tdmpc2
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/data/round/code/sd_world_model_rl/outputs/2026-04-16/00-14-40
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_local
      hydra/output: default
  verbose: false
